# En release är en tagg vX.Y.Z på main. Releasen bär det byggda paketet (npm pack),
# som apparna installerar via URL tills ett register är valt
# (ArvidGardebo/adecla-context#41); då läggs publiceringen till här.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Taggen matchar package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Release-anteckningar ur CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[?"v"\\]?" {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md saknar avsnitt för $version"; exit 1; }
      - run: npm pack
      - run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md adecla-design-*.tgz
        env:
          GH_TOKEN: ${{ github.token }}
